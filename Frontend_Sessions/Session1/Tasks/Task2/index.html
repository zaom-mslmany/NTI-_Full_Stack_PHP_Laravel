<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Appointment Form</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
                             <!-- Doctor Image -->


<div class="photo">
    <img src="images/doctor-image.jpg.jpeg" alt="Doctor">
</div>

                                <!--Appointment Form -->

<main class="Form-container">

                               <!--Appointment Title -->
     <h1>Doctor Appointment Form</h1>
    <hr>

                               <!--Appointment Date -->
<div class="form-row">

    <label>Appointment Date</label>
    <input type="date">

</div>
                            <!--Appointment Date -->
<div class="form-row">

<label>Appointment Time</label>
<input type="time">

</div>

                         <!--Naming Defination -->

<div class="form-row">
    <label>Name</label>
    <input type="text" placeholder="First">
    <input type="text" placeholder="Last">
</div>
                            <!--Gender -->
<div class="form-row">
    <label>Gender</label>
    <input type="radio" name="gender"> Male
    <input type="radio" name="gender"> Female
</div>
                               <!--Phone -->
<div class="form-row">
    <label>Phone</label>
    <input type="tel" placeholder="####">
</div>
                                <!--Address -->
<div class="form-row">
    <label>Address</label>
    <input type="text" placeholder="city">
    <input type="text" placeholder="state">
</div>

                                     <!--Query -->

       <div class="form-row">


    <label>Your Query</label>
    <textarea></textarea>

</div> 

                             <!--     Appointment Type      -->


<div class="form-row">
    <label>Appointment Type</label>

    <div>
        Select which appointment type(s) you require
        <br>

        <input type="checkbox"> Cervix checkup
        <br>

        <input type="checkbox"> Heart checkup
        <br>

        <input type="checkbox"> Eye check-up
        <br>

        <input type="checkbox"> Hearing Test
        <br>

        <button type="submit">Send</button>
    </div>
</div>



</main>

</body>
</html>
